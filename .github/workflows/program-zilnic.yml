name: Program TV zilnic

# Regenerează docs/ în fiecare zi la 04:17 (ora României, iarna), ca ordinea episoadelor să fie alta.
# Rulează și la fiecare modificare a listelor sau a generatorului.
on:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths: ["date.py", "retro.py", "genereaza.py", ".github/workflows/program-zilnic.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  genereaza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generează addon-ul (cu episoadele din Cinemeta)
        run: python genereaza.py --actualizeaza --data "$(TZ=Europe/Bucharest date +%F)"
      - name: Salvează modificările
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs cache
          git diff --cached --quiet || git commit -m "Program TV $(TZ=Europe/Bucharest date +%F)"
          git push
