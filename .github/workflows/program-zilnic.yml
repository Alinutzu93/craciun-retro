name: Program TV zilnic

# Regenerează docs/ în fiecare zi la 04:17 (ora României, iarna), ca ordinea episoadelor să fie alta.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  genereaza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generează addon-ul
        run: python genereaza.py --data "$(TZ=Europe/Bucharest date +%F)"
      - name: Salvează modificările
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Program TV $(TZ=Europe/Bucharest date +%F)"
          git push
